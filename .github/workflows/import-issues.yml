# Importe les issues définies dans .github/issues.json
# ⚠️ Ne pas lancer plusieurs fois avec dry_run=false : doublons possibles.
#
# Utilisation : Actions → "Import project issues" → Run workflow
# Choisir dry_run = false pour CRÉER les issues (true = simulation uniquement)

name: Import project issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = test SANS créer | false = CRÉER les issues"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  issues: write
  contents: read

jobs:
  import-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import issues from JSON
        id: import
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: .github/issues.json
          file-format: json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event.inputs.dry_run }}

      - name: Résumé de l'import
        run: |
          echo "## Résultat import issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode dry_run :** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Issues créées :** ${{ steps.import.outputs.issues-created }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Échecs :** ${{ steps.import.outputs.issues-failed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "⚠️ **Dry run** : aucune issue n'a été créée. Relancez avec dry_run = **false**." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.import.outputs.issues-created }}" = "0" ]; then
            echo "❌ Aucune issue créée. Vérifiez les permissions Actions (issues: write) dans Settings." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Import terminé. Consultez l'onglet **Issues**." >> $GITHUB_STEP_SUMMARY
          fi
