# Importe les issues définies dans .github/issues.json (API REST, sans git push).
#
# Utilisation : Actions → "Import project issues" → Run workflow
#   dry_run = true  → simulation
#   dry_run = false → création (ignore les titres déjà existants)
#
# Si erreur 403 : Settings → Actions → General → "Read and write permissions"
# Secours : ajouter le secret ISSUES_IMPORT_TOKEN (PAT avec scope repo)

name: Import project issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = test SANS créer | false = CRÉER les issues"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "true = recréer même si le titre existe déjà (doublons)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  issues: write
  contents: read

jobs:
  import-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import issues from JSON
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUES_IMPORT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS="--file .github/issues.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/import_issues.py $ARGS

      - name: Résumé
        if: always()
        run: |
          echo "## Import issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **dry_run :** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **force :** ${{ github.event.inputs.force }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Mode simulation : consultez les logs de l'étape précédente." >> $GITHUB_STEP_SUMMARY
          else
            echo "Consultez l'onglet **Issues** du dépôt." >> $GITHUB_STEP_SUMMARY
          fi
