# Importe les issues définies dans .github/issues.json
# ⚠️ Ne pas lancer plusieurs fois sans besoin : cela recrée des issues en double.
#
# Utilisation : GitHub → Actions → "Import project issues" → Run workflow

name: Import project issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test sans créer d'issues)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  issues: write
  contents: read

jobs:
  import-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import issues from JSON
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: .github/issues.json
          file-format: json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event.inputs.dry_run }}
